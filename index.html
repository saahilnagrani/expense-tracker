<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Expense Tracker</title>
<link rel="stylesheet" href="./assets/css/styles.css?v=41" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>" />

<!-- Installable app (PWA) -->
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#2f6df6" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Expenses" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />

<div id="app">
  <header class="topbar">
    <div class="brand">💸 <span>Expense Tracker</span></div>
    <nav class="tabs">
      <button class="tab" data-view="dashboard"><span class="tab-ic">📊</span><span class="tab-tx">Dashboard</span></button>
      <button class="tab" data-view="expenses"><span class="tab-ic">🧾</span><span class="tab-tx">Expenses</span></button>
      <button class="tab" data-view="add"><span class="tab-ic">📅</span><span class="tab-tx">Fixed</span></button>
      <button class="tab" data-view="import"><span class="tab-ic">📥</span><span class="tab-tx">Import</span></button>
      <button class="tab" data-view="settings"><span class="tab-ic">⚙️</span><span class="tab-tx">Settings</span></button>
    </nav>
    <div class="base-pill" id="basePill" title="Base currency"></div>
  </header>

  <main id="views">
    <!-- Views are rendered by app.js -->
  </main>

  <div id="toast" class="toast" hidden></div>

  <!-- Modal host -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button class="icon-btn" id="modalClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
</div>

<script type="module" src="./assets/js/app.js?v=41"></script>
